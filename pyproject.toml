# 프로젝트 패키지·런타임 의존성과 CLI 진입점을 정의함
[project]
name = "rag-ollama"
version = "0.1.0"
description = "Hugging Face Transformers model experiments with local document diagnostics and pgvector RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "accelerate>=1.6.0",
    "flagembedding>=1.4.2",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "pypdf>=5.0.0",
    "psycopg[binary]>=3.3.6",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "torch>=2.6.0",
    "transformers>=4.51.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
quantization = ["bitsandbytes>=0.48.0"]

[project.scripts]
rag-ollama = "rag_ollama:main"
rag-ollama-api = "rag_ollama.api:run"
rag-ollama-evaluate = "rag_ollama.evaluation:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

# NOTE: 로컬 PostgreSQL·pgvector 개발 서비스를 정의함
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: raglab
      POSTGRES_USER: raglab
      POSTGRES_PASSWORD: raglab-dev-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - raglab-postgres:/var/lib/postgresql/data

volumes:
  raglab-postgres:
